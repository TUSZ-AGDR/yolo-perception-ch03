# 自动下载脚本（ultralytics 在数据集缺失时自动执行）
download: |
  from pathlib import Path
  from ultralytics.utils.downloads import download

  dir = Path(yaml["path"])  # data/coco
  dir.mkdir(parents=True, exist_ok=True)

  # 1. 下载标注文件（约 2MB）
  labels_url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/coco2017labels.zip"
  print(f"[下载] 标注文件 -> {dir} ...")
  download(labels_url, dir=dir)

  # 2. 下载图片（train + val，约 20GB）
  images_dir = dir / "images"
  images_dir.mkdir(parents=True, exist_ok=True)
  urls = [
      "http://images.cocodataset.org/zips/train2017.zip",
      "http://images.cocodataset.org/zips/val2017.zip",
  ]
  print(f"[下载] 图片文件 -> {images_dir}，约 20GB，请耐心等待...")
  download(urls, dir=str(images_dir))
