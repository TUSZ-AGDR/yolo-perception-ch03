# COCO 2017 数据集配置
# 用法：python scripts/train.py --data config/coco.yaml --epochs 100
#
# 首次运行时会自动下载：
#   - 标注文件（约 2MB）
#   - train2017 图片（约 19GB, 118K 张）
#   - val2017 图片（约 1GB, 5K 张）
# 数据集将存放于 data/coco/ 目录

path: data/coco              # 数据集根目录（相对于运行目录 yolo_coco/）
train: train2017.txt         # 训练集图片列表（118287 张）
val: val2017.txt             # 验证集图片列表（5000 张）
test: test-dev2017.txt       # 测试集（无公开标注，需提交官方）

